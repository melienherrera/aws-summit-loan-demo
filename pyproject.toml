[project]
name = "loan-demo"
version = "0.1.0"
description = "AWS Summit booth demo: Temporal + Strands Agents + AWS Bedrock loan underwriting"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.39.0",
    "strands-agents-tools>=0.5.2",
    "temporalio[strands-agents,pydantic]>=1.27.0",
    "boto3>=1.34.92,<2",
    "python-dotenv",
    "nanoid",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# Temporary: pinned to the strands-branch commit until temporalio[strands-agents] ships to PyPI.
temporalio = { git = "https://github.com/temporalio/sdk-python.git", rev = "c84320c" }
